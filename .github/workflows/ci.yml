name: Compatibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: checks
            command: pnpm check
          - name: reference
            command: pnpm test:reference
          - name: local
            command: pnpm test:local
          - name: recovery
            command: pnpm test:recovery
          - name: multinode
            command: pnpm test:multinode
          - name: fleet
            command: pnpm test:fleet
          - name: resilience
            command: pnpm test:resilience
          - name: traffic
            command: pnpm test:traffic
          - name: dependencies
            command: pnpm test:dependencies
          - name: faults
            command: pnpm test:faults
          - name: capacity
            command: pnpm test:capacity
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compatibility-evidence-${{ matrix.name }}
          path: artifacts/
          retention-days: 7
