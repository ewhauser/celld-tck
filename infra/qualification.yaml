services:
  tool:
    environment:
      S3_ENDPOINT: http://proxy:8082
  proxy:
    image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    command: [node, /fixture/proxy.mjs]
    environment:
      TCK_PROXY_CHILD: "1"
    volumes:
      - type: bind
        source: ${TCK_FIXTURE_DIR:?}
        target: /fixture
        read_only: true
    ports: ["127.0.0.1::9091"]
    networks: [default, store]
  celld:
    command:
      [
        --listen,
        "0.0.0.0:8080",
        --internal-listen,
        "0.0.0.0:8081",
        --advertise,
        "peer-celld:8081",
      ]
    environment:
      S3_ENDPOINT: http://proxy:8082
      CELLD_DURABILITY: ${TCK_DURABILITY:-fleet}
      CELLD_REBALANCE_INTERVAL_MS: "0"
    networks:
      default:
        aliases: [peer-celld]
      store:
  celld2:
    command:
      [
        --listen,
        "0.0.0.0:8080",
        --internal-listen,
        "0.0.0.0:8081",
        --advertise,
        "peer-celld2:8081",
      ]
    environment:
      S3_ENDPOINT: http://proxy:8082
      CELLD_DURABILITY: ${TCK_DURABILITY:-fleet}
      CELLD_REBALANCE_INTERVAL_MS: "0"
    networks:
      default:
        aliases: [peer-celld2]
      store:
  celld3:
    command:
      [
        --listen,
        "0.0.0.0:8080",
        --internal-listen,
        "0.0.0.0:8081",
        --advertise,
        "peer-celld3:8081",
      ]
    environment:
      S3_ENDPOINT: http://proxy:8082
      CELLD_DURABILITY: ${TCK_DURABILITY:-fleet}
      CELLD_REBALANCE_INTERVAL_MS: "0"
    networks:
      default:
        aliases: [peer-celld3]
      store:
